server:
  port: 9001
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  config:
    # 启动时自动加载项目根目录 .env（密钥/数据库等配置无需手动传参）
    import: optional:file:./.env[.properties]
  application:
    name: football-user-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:football_forecast}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL_ENABLE:false}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
      mail.smtp.timeout: ${MAIL_SMTP_TIMEOUT:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}
  cloud:
    nacos:
      discovery:
        enabled: true
        # 本地默认 127.0.0.1；容器环境由 NACOS_ADDR 注入为 nacos:8848。
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_IP:127.0.0.1}
    sentinel:
      enabled: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  demo-accounts-enabled: ${SECURITY_DEMO_ACCOUNTS_ENABLED:false}
  refresh-token-cookie-only: ${SECURITY_REFRESH_TOKEN_COOKIE_ONLY:false}
  rate-limit:
    fail-closed: ${AUTH_RATE_LIMIT_FAIL_CLOSED:false}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
    # 生产默认禁止在日志中打印验证码；本地调试必须显式开启。
    console-mode: ${EMAIL_VERIFICATION_CONSOLE_MODE:false}
  jwt:
    issuer: footballforecastsystem
    # 必须通过环境变量注入；缺失时应用拒绝启动。
    secret: ${JWT_SECRET}

app:
  runtime-ddl-enabled: ${APP_RUNTIME_DDL_ENABLED:true}
  schema:
    require-migrations: ${APP_SCHEMA_REQUIRE_MIGRATIONS:false}
    required-tables: ${APP_SCHEMA_REQUIRED_TABLES:t_user,t_user_legal_consent}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: when-authorized

notifications:
  reminder-initial-delay-ms: ${NOTIFICATION_REMINDER_INITIAL_DELAY_MS:45000}
  reminder-interval-ms: ${NOTIFICATION_REMINDER_INTERVAL_MS:300000}
