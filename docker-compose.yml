version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: football-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_DATABASE: football_forecast
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - football-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: football-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - football-network

  # Nacos 服务注册中心
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: football-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      football-network:
        aliases:
          - nacos
          - football-nacos
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  mysql_data:
  redis_data:
  nacos_data:

networks:
  football-network:
    name: footballforecastsystem_football-network
    driver: bridge
