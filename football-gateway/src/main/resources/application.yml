server:
  port: 8082

spring:
  config:
    # 启动时自动加载项目根目录 .env（密钥/数据库等配置无需手动传参）
    import: optional:file:./.env[.properties]
  application:
    name: football-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    sentinel:
      enabled: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
    gateway:
      global-filter:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@clientAddressKeyResolver}"
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH:120}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:240}
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: user-service
          uri: lb://football-user-service
          predicates: [ Path=/api/users/** ]

        - id: admin-user-service
          uri: lb://football-user-service
          predicates:
            - Path=/api/admin/users
            - Path=/api/admin/users/**

        - id: match-service
          uri: lb://football-business-service
          predicates: [ Path=/api/matches/** ]

        - id: admin-match-service
          uri: lb://football-business-service
          predicates: [ Path=/api/admin/matches/** ]

        - id: news-service
          uri: lb://football-business-service
          predicates: [ Path=/api/news/** ]

        - id: changelog-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/changelog
            - Path=/api/changelog/**

        - id: content-service
          uri: lb://football-business-service
          predicates: [ Path=/api/content/** ]

        - id: admin-news-service
          uri: lb://football-business-service
          predicates: [ Path=/api/admin/news/** ]

        - id: admin-changelog-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/admin/changelog
            - Path=/api/admin/changelog/**

        - id: admin-content-source-service
          uri: lb://football-business-service
          predicates: [ Path=/api/admin/content/sources/** ]

        - id: admin-video-status-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/admin/videos/*/status

        - id: admin-video-detail-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/admin/videos/*

        - id: admin-video-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/admin/videos
            - Path=/api/admin/videos/**

        - id: public-video-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/videos
            - Path=/api/videos/**

        - id: admin-config-service
          uri: lb://football-business-service
          predicates: [ Path=/api/admin/config/** ]

        - id: team-service
          uri: lb://football-business-service
          predicates: [ Path=/api/teams/** ]

        - id: prediction-service
          uri: lb://football-business-service
          predicates: [ Path=/api/predictions/** ]

        - id: data-sync-service
          uri: lb://football-business-service
          predicates: [ Path=/api/sync/** ]

        - id: crawler-service
          uri: lb://football-business-service
          predicates: [ Path=/api/crawler/** ]

        - id: media-service
          uri: lb://football-business-service
          predicates: [ Path=/api/media/** ]

        - id: card-workshop-service
          uri: lb://football-business-service
          predicates: [ Path=/api/card-workshop/** ]

        - id: card-rogue-service
          uri: lb://football-business-service
          predicates: [ Path=/api/card-rogue/** ]

        - id: agent-service
          uri: lb://football-business-service
          predicates:
            - Path=/api/agent
            - Path=/api/agent/**

        - id: proxy-service
          uri: lb://football-business-service
          predicates: [ Path=/api/proxy/** ]

        - id: analytics-service
          uri: lb://football-business-service
          predicates: [ Path=/api/analytics/** ]

        - id: search-service
          uri: lb://football-business-service
          predicates: [ Path=/api/search/** ]

      default-filters:
        - name: Retry
          args:
            retries: 2
            statuses: INTERNAL_SERVER_ERROR,SERVICE_UNAVAILABLE
            methods: GET,HEAD,OPTIONS
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              maxAttempts: 3

      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
        pool:
          type: FIXED
          max-connections: 1000
          acquire-timeout: 30000
          idle-timeout: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: when-authorized

api:
  version: v1
  timeout: 30000

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN
