version: '3.8'

x-java-service-env: &java-service-env
  SPRING_PROFILES_ACTIVE: prod
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DB: ${MYSQL_DB}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  NACOS_ADDR: nacos:8848
  JWT_SECRET: ${JWT_SECRET}
  API_FOOTBALL_KEY: ${API_FOOTBALL_API_KEY:-}
  JUHE_API_KEY: ${JUHE_FOOTBALL_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
  SCNET_API_KEY: ${SCNET_API_KEY:-}
  SCNET_BASE_URL: ${SCNET_BASE_URL:-https://api.scnet.cn/api/llm/v1}
  SCNET_MODEL: ${SCNET_MODEL:-GLM-5-Base}
  SCNET_MODELS: ${SCNET_MODELS:-GLM-5-Base}
  CRAWLER_BASE_URL: http://football-business-service:9000
  USER_SERVICE_BASE_URL: http://football-user-service:9001
  PYTHON_INFERENCE_ENABLED: ${PYTHON_INFERENCE_ENABLED:-true}
  PYTHON_INFERENCE_URL: http://football-ml-service:5001
  PYTHON_INFERENCE_TOKEN: ${ML_INTERNAL_TOKEN:-}
  AGENT_AUTHENTICATED_LIMIT_PER_MINUTE: ${AGENT_AUTHENTICATED_LIMIT_PER_MINUTE:-20}
  AGENT_ANONYMOUS_LIMIT_PER_MINUTE: ${AGENT_ANONYMOUS_LIMIT_PER_MINUTE:-3}
  AGENT_DAILY_TOKEN_BUDGET: ${AGENT_DAILY_TOKEN_BUDGET:-20000}
  AGENT_RATE_LIMIT_FAIL_CLOSED: ${AGENT_RATE_LIMIT_FAIL_CLOSED:-true}
  MEDIA_PROXY_ENABLED: ${MEDIA_PROXY_ENABLED:-true}
  MEDIA_PROXY_CACHE_DIR: /data/football/media-cache
  MEDIA_PROXY_DISK_TTL_HOURS: ${MEDIA_PROXY_DISK_TTL_HOURS:-720}
  MEDIA_PROXY_MAX_DISK_BYTES: ${MEDIA_PROXY_MAX_DISK_BYTES:-1073741824}
  MEDIA_PROXY_WARMUP_ENABLED: ${MEDIA_PROXY_WARMUP_ENABLED:-true}
  MEDIA_PROXY_WARMUP_MAX_PER_RUN: ${MEDIA_PROXY_WARMUP_MAX_PER_RUN:-100}
  AUTH_RATE_LIMIT_FAIL_CLOSED: ${AUTH_RATE_LIMIT_FAIL_CLOSED:-true}
  SECURITY_REFRESH_TOKEN_COOKIE_ONLY: ${SECURITY_REFRESH_TOKEN_COOKIE_ONLY:-true}
  # 默认不信任客户端可伪造的转发头；确认前置网关会清洗并重写后再显式设置为 true。
  GATEWAY_TRUST_PROXY_HEADERS: ${GATEWAY_TRUST_PROXY_HEADERS:-false}
  GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-https://football.example.com,https://www.football.example.com}
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
  ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-180}
  APP_RUNTIME_DDL_ENABLED: ${APP_RUNTIME_DDL_ENABLED:-false}
  APP_SCHEMA_REQUIRE_MIGRATIONS: ${APP_SCHEMA_REQUIRE_MIGRATIONS:-true}
  APP_SCHEMA_REQUIRED_TABLES: ${APP_SCHEMA_REQUIRED_TABLES:-t_user,crawler_matches,t_match_prediction,t_prematch_feature_snapshot,t_agent_conversation,t_analytics_event,t_user_legal_consent}
  # SMTP：用于注册和密码找回验证码。MAIL_USERNAME 应与发件邮箱一致。
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
  MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
  MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-false}
  MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
  MAIL_SMTP_CONNECTION_TIMEOUT: ${MAIL_SMTP_CONNECTION_TIMEOUT:-10000}
  MAIL_SMTP_TIMEOUT: ${MAIL_SMTP_TIMEOUT:-10000}
  MAIL_SMTP_WRITE_TIMEOUT: ${MAIL_SMTP_WRITE_TIMEOUT:-10000}
  EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
  EMAIL_VERIFICATION_CONSOLE_MODE: ${EMAIL_VERIFICATION_CONSOLE_MODE:-false}
  TZ: Asia/Shanghai

services:
  mysql:
    image: mysql:8.0
    container_name: football-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/football_forecast.sql:/docker-entrypoint-initdb.d/01-football-forecast.sql:ro
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: football-redis
    restart: unless-stopped
    command: sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"; else redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - football-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: football-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 30

  football-gateway:
    build:
      context: .
      dockerfile: Dockerfile.spring
      args:
        MODULE: football-gateway
    container_name: football-gateway
    restart: unless-stopped
    environment:
      <<: *java-service-env
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - football-network

  football-user-service:
    build:
      context: .
      dockerfile: Dockerfile.spring
      args:
        MODULE: football-user-service
    container_name: football-user-service
    restart: unless-stopped
    environment:
      <<: *java-service-env
      # Gmail SMTP 的 IPv4 地址轮换可能导致单个地址超时；允许通过 USER_JAVA_TOOL_OPTIONS 覆盖。
      JAVA_TOOL_OPTIONS: ${USER_JAVA_TOOL_OPTIONS:--Djava.net.preferIPv6Addresses=true -Dsun.net.inetaddr.ttl=60}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - football-network

  football-business-service:
    build:
      context: .
      dockerfile: Dockerfile.spring
      args:
        MODULE: football-business-service
    container_name: football-business-service
    restart: unless-stopped
    environment:
      <<: *java-service-env
      # 历史比赛缓存不进入 Git 和 Java 镜像，部署前需从训练/数据归档机上传到该目录。
      HISTORICAL_MATCH_CACHE_PATH: /app/historical-cache
      HISTORICAL_MATCH_CACHE_REQUIRED: ${HISTORICAL_MATCH_CACHE_REQUIRED:-true}
    volumes:
      - ./football-ml-service/data_cache:/app/historical-cache:ro
      - media_cache:/data/football/media-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      football-ml-service:
        condition: service_healthy
    networks:
      - football-network

  football-ml-service:
    build:
      context: ./football-ml-service
    container_name: football-ml-service
    restart: unless-stopped
    environment:
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY:-}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-}
      ML_REQUIRE_INTERNAL_AUTH: ${ML_REQUIRE_INTERNAL_AUTH:-true}
      ML_MAX_REQUEST_BYTES: ${ML_MAX_REQUEST_BYTES:-65536}
      TZ: Asia/Shanghai
    volumes:
      - ./football-ml-service/models:/app/models:ro
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: football-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    depends_on:
      football-gateway:
        condition: service_started
    networks:
      - football-network

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  media_cache:

networks:
  football-network:
    driver: bridge
